<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Full On Rogues (Boris)">
<title>{{title}} · Full On Rogues</title>
<link rel="icon" type="image/svg+xml" href="{{asset-url assets/favicon.svg}}">
<link rel="stylesheet" href="{{asset-url assets/cantilever.css}}">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/index.html" aria-label="Full On Rogues Home">
      <span class="brand__mark" aria-hidden="true">🗡️</span>
      <span class="brand__name">Full On Rogues</span>
    </a>
    <section class="site-search" data-cantilever-search-ui aria-labelledby="cantilever-search-label">
      <form action="_boris/search/" method="get" role="search" data-cantilever-search-form>
        <label class="site-search__label" id="cantilever-search-label" for="cantilever-search-input">Search the archive</label>
        <div class="site-search__controls">
          <span class="site-search__icon" aria-hidden="true">⌕</span>
          <input id="cantilever-search-input" class="site-search__input" name="q" type="search" autocomplete="off" placeholder="Search the archive…" spellcheck="false" aria-controls="cantilever-search-results" aria-expanded="false">
          <kbd class="site-search__shortcut" aria-hidden="true">/</kbd>
          <button class="site-search__button" type="submit">Search</button>
        </div>
      </form>
      <p class="site-search__status" data-cantilever-search-status role="status" aria-live="polite">Loading archive index…</p>
      <ol id="cantilever-search-results" class="site-search__results" data-cantilever-search-results aria-label="Search results"></ol>
      <noscript><p class="site-search__fallback">Search requires JavaScript. Use navigation to browse the archive.</p></noscript>
    </section>
  </div>
</header>

<div class="site-shell">
  <aside class="site-side">
    <details class="site-nav-drawer" open>
      <summary class="site-nav-drawer__summary">Archive navigation</summary>
      {{nav}}
    </details>
  </aside>

  <div class="site-main">
    <div class="breadcrumb-wrap">{{breadcrumb}}</div>

    <main class="page-grid page-grid--single" id="main-content">
      <article class="page article" tabindex="-1">
        {{content}}
      </article>
    </main>

    <div class="page-foot">
      <div class="page-children-wrap">{{children}}</div>
    </div>

    <footer class="site-footer">
      <p>Full On Rogues · a Feathermoon guild archive · statically generated by Boris</p>
    </footer>
  </div>
</div>

<script src="{{asset-url assets/cantilever.js}}" defer></script>
</body>
</html>
