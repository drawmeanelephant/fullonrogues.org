name: CI & Graph Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  BORIS_REPOSITORY: https://github.com/drawmeanelephant/boris.git
  BORIS_BRANCH: main
  BORIS_JOBS: 1

jobs:
  validate-and-build:
    name: Validate & Build Site
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig 0.16.0
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.16.0

      - name: Cache Zig compiler directories
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            ${{ runner.temp }}/zig-local-cache
          key: ${{ runner.os }}-zig-${{ env.BORIS_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.BORIS_BRANCH }}-
            ${{ runner.os }}-zig-

      - name: Obtain Boris compiler
        run: |
          git clone --branch "$BORIS_BRANCH" --single-branch --depth=1 "$BORIS_REPOSITORY" "$RUNNER_TEMP/boris"

      - name: Build Boris
        working-directory: ${{ runner.temp }}/boris
        run: |
          zig build
          mkdir -p "${{ github.workspace }}/bin"
          cp zig-out/bin/boris "${{ github.workspace }}/bin/boris"
          chmod +x "${{ github.workspace }}/bin/boris"

      - name: Run graph validation and build
        env:
          BORIS_BIN: ./bin/boris
          BORIS_JOBS: ${{ env.BORIS_JOBS }}
        run: ./bin/validate_graph.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/cantilever/
